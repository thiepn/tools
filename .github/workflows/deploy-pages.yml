name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      rollback_available: ${{ steps.retain_previous.outputs.rollback_available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify production chunk graph
        run: npm run build:verify

      - name: Previous-generation retention self-test
        run: npm run build:retention-test

      - name: Check R9 live harness syntax
        run: node --check scripts/r9-live-site-smoke.mjs

      - name: Check live asset integrity harness syntax
        run: node --check scripts/live-asset-integrity.mjs

      - name: Check initial bundle budgets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const script = html.match(/<script[^>]+src="([^"]+\.js)"/i)?.[1];
          const stylesheet = html.match(/<link[^>]+rel="stylesheet"[^>]+href="([^"]+\.css)"/i)?.[1]
            ?? html.match(/<link[^>]+href="([^"]+\.css)"[^>]+rel="stylesheet"/i)?.[1];
          if (!script || !stylesheet) {
            throw new Error('Could not identify initial JS/CSS assets from dist/index.html');
          }
          const resolveAsset = (asset) => {
            const parsed = new URL(asset, 'https://example.invalid/tools/');
            if (!parsed.pathname.startsWith('/tools/')) {
              throw new Error(`Initial asset escaped /tools/: ${asset}`);
            }
            return path.join('dist', parsed.pathname.slice('/tools/'.length));
          };
          const js = fs.readFileSync(resolveAsset(script));
          const css = fs.readFileSync(resolveAsset(stylesheet));
          const sizes = {
            jsRaw: js.length,
            jsGzip: zlib.gzipSync(js).length,
            cssRaw: css.length,
            cssGzip: zlib.gzipSync(css).length,
          };
          const budgets = {
            jsRaw: 350 * 1024,
            jsGzip: 110 * 1024,
            cssRaw: 150 * 1024,
            cssGzip: 30 * 1024,
          };
          const kib = (bytes) => (bytes / 1024).toFixed(2);
          console.log(`Initial JS: ${kib(sizes.jsRaw)} KiB raw / ${kib(sizes.jsGzip)} KiB gzip`);
          console.log(`Initial CSS: ${kib(sizes.cssRaw)} KiB raw / ${kib(sizes.cssGzip)} KiB gzip`);
          console.log(`Budgets: JS ${kib(budgets.jsRaw)} KiB raw / ${kib(budgets.jsGzip)} KiB gzip; CSS ${kib(budgets.cssRaw)} KiB raw / ${kib(budgets.cssGzip)} KiB gzip`);
          const exceeded = Object.keys(budgets).filter((key) => sizes[key] > budgets[key]);
          if (exceeded.length) {
            console.error(`Bundle budget exceeded: ${exceeded.join(', ')}`);
            process.exitCode = 1;
          }
          NODE

      - name: Chromium route acceptance
        run: npm run browser:smoke

      - name: Chromium navigation reliability
        run: npm run browser:navigation

      - name: Chromium stale-deployment recovery
        run: npm run browser:module-recovery

      - name: Chromium functional acceptance
        run: npm run browser:functional

      - name: Chromium capability acceptance
        run: npm run browser:capabilities

      - name: Chromium compatibility acceptance
        run: npm run browser:compatibility

      - name: Retain previous production asset generation
        id: retain_previous
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          TINY_TOOLS_ROLLBACK_DIR: ${{ runner.temp }}/tiny-tools-last-known-good
        run: npm run build:retain-previous

      - name: Upload last-known-good rollback artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.retain_previous.outputs.rollback_available == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-rollback
          path: ${{ steps.retain_previous.outputs.rollback_path }}
          retention-days: 90

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 90

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")"

          if [ "$status" = "200" ]; then
            echo 'GitHub Pages site is enabled.'
            exit 0
          fi

          if [ "$status" = "404" ]; then
            echo '::error::GitHub Pages is not enabled for this repository. One-time setup required: Settings → Pages → Build and deployment → Source → GitHub Actions.'
            exit 1
          fi

          echo "::error::Unable to verify GitHub Pages configuration (HTTP ${status})."
          cat /tmp/pages-site.json || true
          exit 1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Live production asset integrity
        env:
          TINY_TOOLS_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/live-asset-integrity.mjs "$TINY_TOOLS_LIVE_URL"

      - name: Live GitHub Pages acceptance
        env:
          TINY_TOOLS_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/r9-live-site-smoke.mjs "$TINY_TOOLS_LIVE_URL"

  rollback:
    if: ${{ always() && needs.validate.result == 'success' && needs.deploy.result == 'success' && needs.live-acceptance.result == 'failure' && needs.validate.outputs.rollback_available == 'true' }}
    needs: [validate, deploy, live-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.rollback_deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.rollback_deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages for rollback
        uses: actions/configure-pages@v5

      - name: Roll back to last-known-good Pages artifact
        id: rollback_deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback

  rollback-acceptance:
    if: ${{ always() && needs.rollback.result == 'success' }}
    needs: rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify rolled-back live site
        env:
          TINY_TOOLS_LIVE_URL: ${{ needs.rollback.outputs.page_url }}
        run: node scripts/r9-live-site-smoke.mjs "$TINY_TOOLS_LIVE_URL"
