name: Phase 5 files certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Run Phase 5 deterministic files contracts
        run: npm run test:phase5
      - name: Run full unit regression
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify production build
        run: npm run build:verify
      - name: Run 11-route files browser certification
        run: npm run browser:files
      - name: Verify blocked-workflow coverage
        run: |
          node -e "const fs=require('fs');const p='artifacts/phase5-files-certification/files-certification.json';if(!fs.existsSync(p))throw new Error('files certification missing');const r=JSON.parse(fs.readFileSync(p,'utf8'));if(r.familyTotal!==24)throw new Error('expected 24 files routes');if(r.summary?.total!==11)throw new Error('expected 11 Phase 5 target routes');if(r.summary?.FAIL)throw new Error('files certification contains failures');if(r.summary?.PASS!==11)throw new Error('expected 11 PASS');console.log(r.summary)"
      - name: Publish summary
        if: always()
        run: |
          test -f artifacts/phase5-files-certification/files-certification.md && cat artifacts/phase5-files-certification/files-certification.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-files-certification
          path: artifacts/phase5-files-certification/
          if-no-files-found: error
