name: R11 full catalog audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: r11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-all-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify production build
        run: npm run build:verify

      - name: Audit all 351 tools
        run: npm run browser:full-audit
