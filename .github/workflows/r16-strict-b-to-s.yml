name: R16 strict B-to-S acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-b-to-s:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check R16 harness syntax
        run: node --check scripts/r16-strict-b-to-s-smoke.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify production build
        run: npm run build:verify
      - name: Audit 198 strict B-tier routes
        run: npm run browser:strict-b-to-s
