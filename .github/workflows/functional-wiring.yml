name: Functional correctness wiring

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Deterministic regression suite
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify production build
        run: npm run build:verify
      - name: Exercise production tool wiring
        id: wiring
        continue-on-error: true
        run: npm run browser:functional-wiring
      - name: Exercise real media processing
        id: media
        continue-on-error: true
        run: npm run browser:real-media
      - name: Exercise unified converters
        id: converters
        continue-on-error: true
        run: npm run browser:real-converters
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: functional-wiring-351
          path: |
            artifacts/functional-wiring/
            artifacts/real-media/
            artifacts/real-converters/
          if-no-files-found: error
      - name: Enforce functional correctness gates
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=(p)=>{if(!fs.existsSync(p))throw new Error(p+' missing');return JSON.parse(fs.readFileSync(p,'utf8'));};
          const wiring=read('artifacts/functional-wiring/functional-wiring.json').summary||{};
          if(wiring.total!==351||wiring.PASS!==351||wiring.INCONCLUSIVE!==0||wiring.FAIL!==0){
            throw new Error(`Functional wiring gate failed: ${JSON.stringify(wiring)}`);
          }
          const media=read('artifacts/real-media/real-media.json').summary||{};
          if(media.total!==28||media.PASS!==28||media.FAIL!==0){
            throw new Error(`Real media gate failed: ${JSON.stringify(media)}`);
          }
          const converters=read('artifacts/real-converters/real-converters.json').summary||{};
          if(converters.total!==6||converters.PASS!==6||converters.FAIL!==0){
            throw new Error(`Unified converter gate failed: ${JSON.stringify(converters)}`);
          }
          console.log({wiring,media,converters});
          NODE
