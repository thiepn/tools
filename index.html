<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#171717" />
    <meta name="application-name" content="Tiny Tools" />
    <title>Tiny Tools - Small tools. Zero friction.</title>
    <meta name="description" content="Fast, privacy-first browser utilities for PDFs, files, images, media, calculators, text, study, planning, diagnostics, and everyday tasks." />
    <meta property="og:title" content="Tiny Tools - Small tools. Zero friction." />
    <meta property="og:description" content="Practical privacy-first browser utilities with local processing for everyday work, files, media, documents, calculations, and developer tasks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(error => {
            console.warn('Tiny Tools service worker registration failed.', error);
          });
        }, { once: true });
      }
    </script>
  </body>
</html>
